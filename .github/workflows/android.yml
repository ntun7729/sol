name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'internal/mobileclient/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.2.12479018'

      - name: Fetch pinned tun2socks source
        run: sh android/scripts/fetch-hev.sh

      - name: Build SOL Android native cores
        run: sh android/scripts/build-solcore.sh "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build release, debug, and probe APKs
        run: |
          gradle -p android --no-daemon \
            :app:assembleRelease \
            :app:assembleDebug \
            :probe:assembleDebug

      - name: Package APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist dist-test
          cp android/app/build/outputs/apk/release/app-release.apk dist/sol-vpn-android-beta.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-test/sol-vpn-debug.apk
          cp android/probe/build/outputs/apk/debug/probe-debug.apk dist-test/sol-vpn-probe-debug.apk
          (cd dist && sha256sum sol-vpn-android-beta.apk > SHA256SUMS-android.txt)
          ls -lh dist dist-test

      - uses: actions/upload-artifact@v4
        with:
          name: sol-vpn-android-beta
          path: |
            dist/sol-vpn-android-beta.apk
            dist/SHA256SUMS-android.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sol-vpn-android-test-apks
          path: |
            dist-test/sol-vpn-debug.apk
            dist-test/sol-vpn-probe-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: actions/download-artifact@v4
        with:
          name: sol-vpn-android-test-apks
          path: dist-test

      - name: Android 14 end-to-end VPN smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/scripts/emulator-smoke.sh
