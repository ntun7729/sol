name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'internal/mobileclient/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.2.12479018'

      - name: Fetch pinned tun2socks source
        run: sh android/scripts/fetch-hev.sh

      - name: Build SOL Android native core
        run: sh android/scripts/build-solcore.sh "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build installable ARM64 APK
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sol-vpn-android-arm64-beta.apk
          (cd dist && sha256sum sol-vpn-android-arm64-beta.apk > SHA256SUMS-android.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sol-vpn-android-arm64-beta
          path: |
            dist/sol-vpn-android-arm64-beta.apk
            dist/SHA256SUMS-android.txt
          if-no-files-found: error
