name: live-render-perf

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-render-perf.yml'
      - 'cmd/sol/**'
      - 'go.mod'

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o sol ./cmd/sol
      - name: Secure token handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="$GITHUB_RUN_ID"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/live-bench-key.pem >/dev/null 2>&1
          openssl pkey -in /tmp/live-bench-key.pem -pubout -out /tmp/live-bench-pub.pem >/dev/null 2>&1
          PUB=$(base64 -w0 /tmp/live-bench-pub.pem)
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/4/comments" -f body="BENCH_PUBKEY:$RUN_KEY:$PUB" >/dev/null

          CIPHER=''
          PREFIX="BENCH_CIPHERTEXT:$RUN_KEY:"
          for _ in $(seq 1 120); do
            BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/4/comments?per_page=100" --jq "[.[] | select(.body | startswith(\"$PREFIX\"))][-1].body // \"\"")
            if [ -n "$BODY" ]; then
              CIPHER=${BODY#"$PREFIX"}
              break
            fi
            sleep 3
          done
          test -n "$CIPHER"
          printf '%s' "$CIPHER" | base64 -d >/tmp/live-bench-token.enc
          TOKEN=$(openssl pkeyutl -decrypt -inkey /tmp/live-bench-key.pem -in /tmp/live-bench-token.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
          test ${#TOKEN} -ge 16
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" >/tmp/live-bench-token
          chmod 600 /tmp/live-bench-token
          rm -f /tmp/live-bench-token.enc /tmp/live-bench-key.pem /tmp/live-bench-pub.pem
      - name: Benchmark deployed Render service
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sol-eve7.onrender.com'
          WS='wss://sol-eve7.onrender.com/ws'
          PROXY='socks5h://127.0.0.1:1080'
          DOWN_URL='https://fsn1-speed.hetzner.com/100MB.bin'
          UP_URL='https://vln038-speedtest-2.tele2.net/upload.php'
          TOKEN=$(cat /tmp/live-bench-token)
          echo "::add-mask::$TOKEN"

          cleanup() {
            rm -f /tmp/live-bench-token /tmp/upload.bin /tmp/stream-*.bin /tmp/multi-*.bin
            if [ -n "${CLIENT_PID:-}" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          FIRST=$(curl -sS --connect-timeout 20 --max-time 120 -o /tmp/health-first -w '%{http_code} %{time_total}' "$BASE/healthz")
          FIRST_CODE=$(awk '{print $1}' <<<"$FIRST")
          FIRST_SEC=$(awk '{print $2}' <<<"$FIRST")
          FIRST_BODY=$(tr -d '\r\n' </tmp/health-first)

          : >/tmp/health-warm-times
          : >/tmp/health-warm-codes
          for _ in 1 2 3 4 5; do
            R=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/health-warm-body -w '%{http_code} %{time_total}' "$BASE/healthz")
            awk '{print $1}' <<<"$R" >>/tmp/health-warm-codes
            awk '{print $2}' <<<"$R" >>/tmp/health-warm-times
          done
          WARM_MS=$(awk '{s+=$1*1000;n++} END {printf "%.2f",s/n}' /tmp/health-warm-times)
          WARM_CODES=$(paste -sd, /tmp/health-warm-codes)

          SOL_SERVER_URL="$WS" SOL_TOKEN="$TOKEN" SOL_LISTEN='127.0.0.1:1080' ./sol client >/tmp/sol-live-client.log 2>&1 &
          CLIENT_PID=$!

          READY=0
          READY_CODE='000'
          for _ in $(seq 1 90); do
            READY_CODE=$(curl -sS --connect-timeout 10 --max-time 30 --proxy "$PROXY" -o /dev/null -w '%{http_code}' https://example.com/ || true)
            if [ "$READY_CODE" = 200 ]; then READY=1; break; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            {
              echo '# Live Render benchmark - connection failure'
              echo
              echo "First health: HTTP $FIRST_CODE in $FIRST_SEC s, body=$FIRST_BODY"
              echo "Warm health codes: $WARM_CODES"
              echo "SOCKS/WSS connectivity to example.com: HTTP $READY_CODE"
              echo
              echo 'Client log:'
              sed 's/^/    /' /tmp/sol-live-client.log || true
            } >live-render-results.md
            cat live-render-results.md
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/4/comments" -F body=@live-render-results.md >/dev/null
            exit 1
          fi

          : >/tmp/live-lat
          for _ in $(seq 1 10); do
            curl -sS --connect-timeout 15 --max-time 60 --proxy "$PROXY" -I -o /dev/null -w '%{time_total}\n' "$DOWN_URL" >>/tmp/live-lat
          done
          LAT_MS=$(awk '{s+=$1*1000;n++} END {printf "%.2f",s/n}' /tmp/live-lat)

          RANGE_TEST_CODE=$(curl -sS --connect-timeout 15 --max-time 60 --proxy "$PROXY" --range 0-1023 -o /tmp/range-test.bin -w '%{http_code}' "$DOWN_URL")
          RANGE_TEST_BYTES=$(stat -c %s /tmp/range-test.bin)
          test "$RANGE_TEST_CODE" = 206
          test "$RANGE_TEST_BYTES" -eq 1024

          : >/tmp/live-down
          for _ in 1 2; do
            curl -fsS --connect-timeout 15 --max-time 240 --proxy "$PROXY" -o /dev/null -w '%{speed_download}\n' "$DOWN_URL" >>/tmp/live-down
          done
          DOWN_MBPS=$(awk '{s+=$1*8/1000000;n++} END {printf "%.2f",s/n}' /tmp/live-down)

          dd if=/dev/zero of=/tmp/upload.bin bs=1M count=8 status=none
          UP_RAW=$(curl -sS --connect-timeout 15 --max-time 180 --proxy "$PROXY" -T /tmp/upload.bin -o /dev/null -w '%{http_code} %{speed_upload}' "$UP_URL" || true)
          UP_CODE=$(awk '{print $1}' <<<"$UP_RAW")
          UP_BPS=$(awk '{print $2}' <<<"$UP_RAW")
          if [ "$UP_CODE" = 200 ] || [ "$UP_CODE" = 201 ]; then
            UP_MBPS=$(awk -v x="$UP_BPS" 'BEGIN {printf "%.2f",x*8/1000000}')
          else
            UP_MBPS="N/A (HTTP ${UP_CODE:-000})"
          fi

          run_stream() {
            local name="$1" bytes="$2" rate="$3" planned="$4"
            local start end elapsed actual delivered result last
            last=$((bytes-1))
            start=$(date +%s%N)
            curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" --range "0-$last" --limit-rate "$rate" -o "/tmp/stream-$name.bin" "$DOWN_URL"
            end=$(date +%s%N)
            actual=$(stat -c %s "/tmp/stream-$name.bin")
            test "$actual" -eq "$bytes"
            elapsed=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.3f",(b-a)/1000000000}')
            delivered=$(awk -v x="$actual" -v s="$elapsed" 'BEGIN {printf "%.2f",x*8/1000000/s}')
            result=$(awk -v e="$elapsed" -v p="$planned" 'BEGIN {if(e<=p*1.30) print "PASS"; else print "FAIL"}')
            rm -f "/tmp/stream-$name.bin"
            printf '%s %s %s\n' "$elapsed" "$delivered" "$result"
          }

          read S1080_SEC S1080_MBPS S1080_RESULT < <(run_stream 1080 15000000 1000k 15)
          read S4K_SEC S4K_MBPS S4K_RESULT < <(run_stream 4k 46875000 3125k 15)

          multi_stream() {
            local name="$1" count="$2" bytes="$3" rate="$4" planned="$5"
            local start end elapsed total size delivered result last
            last=$((bytes-1))
            start=$(date +%s%N)
            pids=()
            for i in $(seq 1 "$count"); do
              curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" --range "0-$last" --limit-rate "$rate" -o "/tmp/multi-$name-$i.bin" "$DOWN_URL" &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
            end=$(date +%s%N)
            total=0
            for i in $(seq 1 "$count"); do
              size=$(stat -c %s "/tmp/multi-$name-$i.bin")
              test "$size" -eq "$bytes"
              total=$((total+size))
              rm -f "/tmp/multi-$name-$i.bin"
            done
            elapsed=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.3f",(b-a)/1000000000}')
            delivered=$(awk -v x="$total" -v s="$elapsed" 'BEGIN {printf "%.2f",x*8/1000000/s}')
            result=$(awk -v e="$elapsed" -v p="$planned" 'BEGIN {if(e<=p*1.30) print "PASS"; else print "FAIL"}')
            printf '%s %s %s\n' "$elapsed" "$delivered" "$result"
          }

          read M1080_SEC M1080_MBPS M1080_RESULT < <(multi_stream 1080 4 15000000 1000k 15)
          read M4K_SEC M4K_MBPS M4K_RESULT < <(multi_stream 4k 2 46875000 3125k 15)

          cat >live-render-results.md <<EOF
          # Live Render benchmark

          Endpoint: sol-eve7.onrender.com
          Runner: ${RUNNER_NAME:-hosted-runner}

          | Test | Result |
          |---|---:|
          | First health | HTTP ${FIRST_CODE}, ${FIRST_SEC} s, body ${FIRST_BODY} |
          | Warm health codes | ${WARM_CODES} |
          | Warm health latency, 5-run avg | ${WARM_MS} ms |
          | SOCKS5/WSS connectivity | PASS |
          | Hetzner HTTPS latency through tunnel, 10-run avg | ${LAT_MS} ms |
          | Hetzner 100 MB download through tunnel, 2-run avg | ${DOWN_MBPS} Mbps |
          | Tele2 8 MiB upload through tunnel | ${UP_MBPS} |

          ## Streaming-like sustained transfers through real Render deployment

          | Profile | Delivered | Completion | Result |
          |---|---:|---:|---|
          | 1080p target 8 Mbps | ${S1080_MBPS} Mbps | ${S1080_SEC} s | ${S1080_RESULT} |
          | 4K target 25 Mbps | ${S4K_MBPS} Mbps | ${S4K_SEC} s | ${S4K_RESULT} |
          | 4 concurrent 1080p, 32 Mbps aggregate | ${M1080_MBPS} Mbps | ${M1080_SEC} s | ${M1080_RESULT} |
          | 2 concurrent 4K, 50 Mbps aggregate | ${M4K_MBPS} Mbps | ${M4K_SEC} s | ${M4K_RESULT} |

          Download and streaming traffic traversed GitHub Actions client -> SOCKS5 -> WSS/TLS -> sol-eve7.onrender.com -> Hetzner. These are paced TCP capacity tests, not DRM/player compatibility or UDP/QUIC tests.
          EOF

          cat live-render-results.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/4/comments" -F body=@live-render-results.md >/dev/null

          test "$FIRST_CODE" = 200
          test "$FIRST_BODY" = ok
          test "$S1080_RESULT" = PASS
          test "$S4K_RESULT" = PASS
          test "$M1080_RESULT" = PASS
          test "$M4K_RESULT" = PASS
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-render-results
          path: live-render-results.md
          if-no-files-found: ignore
