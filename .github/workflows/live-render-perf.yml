name: live-render-perf

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-render-perf.yml'
      - 'cmd/sol/**'
      - 'go.mod'

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o sol ./cmd/sol
      - name: Secure token handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/live-bench-key.pem >/dev/null 2>&1
          openssl pkey -in /tmp/live-bench-key.pem -pubout -out /tmp/live-bench-pub.pem >/dev/null 2>&1
          PUB=$(base64 -w0 /tmp/live-bench-pub.pem)
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/4/comments" -f body="BENCH_PUBKEY:$PUB" >/dev/null

          CIPHER=''
          for _ in $(seq 1 120); do
            CIPHER=$(gh api "repos/$GITHUB_REPOSITORY/issues/4/comments?per_page=100" --jq '[.[] | select(.body | startswith("BENCH_CIPHERTEXT:"))][-1].body // ""' | sed 's/^BENCH_CIPHERTEXT://')
            if [ -n "$CIPHER" ]; then break; fi
            sleep 3
          done
          if [ -z "$CIPHER" ]; then
            echo 'Timed out waiting for encrypted benchmark token.' >&2
            exit 1
          fi

          printf '%s' "$CIPHER" | base64 -d >/tmp/live-bench-token.enc
          TOKEN=$(openssl pkeyutl -decrypt -inkey /tmp/live-bench-key.pem -in /tmp/live-bench-token.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)
          test ${#TOKEN} -ge 16
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" >/tmp/live-bench-token
          chmod 600 /tmp/live-bench-token
          rm -f /tmp/live-bench-token.enc /tmp/live-bench-key.pem /tmp/live-bench-pub.pem
      - name: Benchmark deployed Render service
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sol-eve7.onrender.com'
          WS='wss://sol-eve7.onrender.com/ws'
          PROXY='socks5h://127.0.0.1:1080'
          CF_LAT='https://speed.cloudflare.com/__down?bytes=1'
          CF_DOWN='https://speed.cloudflare.com/__down?bytes=16777216'
          CF_UP='https://speed.cloudflare.com/__up'
          TOKEN=$(cat /tmp/live-bench-token)
          echo "::add-mask::$TOKEN"

          cleanup() {
            rm -f /tmp/live-bench-token /tmp/upload.bin
            if [ -n "${CLIENT_PID:-}" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          FIRST=$(curl -sS --connect-timeout 20 --max-time 120 -o /tmp/health-first -w '%{http_code} %{time_total}' "$BASE/healthz")
          FIRST_CODE=$(awk '{print $1}' <<<"$FIRST")
          FIRST_SEC=$(awk '{print $2}' <<<"$FIRST")
          test "$FIRST_CODE" = 200
          grep -qx 'ok' /tmp/health-first

          : >/tmp/health-warm
          for _ in 1 2 3 4 5; do
            curl -fsS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{time_total}\n' "$BASE/healthz" >>/tmp/health-warm
          done
          WARM_MS=$(awk '{s+=$1*1000;n++} END {printf "%.2f",s/n}' /tmp/health-warm)

          SOL_SERVER_URL="$WS" SOL_TOKEN="$TOKEN" SOL_LISTEN='127.0.0.1:1080' ./sol client >/tmp/sol-live-client.log 2>&1 &
          CLIENT_PID=$!
          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS --connect-timeout 10 --max-time 30 --proxy "$PROXY" "$CF_LAT" -o /dev/null; then READY=1; break; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/sol-live-client.log >&2 || true
            exit 1
          fi

          : >/tmp/live-lat
          for _ in $(seq 1 10); do
            curl -fsS --connect-timeout 15 --max-time 60 --proxy "$PROXY" -o /dev/null -w '%{time_total}\n' "$CF_LAT" >>/tmp/live-lat
          done
          LAT_MS=$(awk '{s+=$1*1000;n++} END {printf "%.2f",s/n}' /tmp/live-lat)

          : >/tmp/live-down
          for _ in 1 2 3; do
            curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" -o /dev/null -w '%{speed_download}\n' "$CF_DOWN" >>/tmp/live-down
          done
          DOWN_MBPS=$(awk '{s+=$1*8/1000000;n++} END {printf "%.2f",s/n}' /tmp/live-down)

          dd if=/dev/zero of=/tmp/upload.bin bs=1M count=8 status=none
          : >/tmp/live-up
          for _ in 1 2; do
            curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" -o /dev/null -w '%{speed_upload}\n' --data-binary @/tmp/upload.bin "$CF_UP" >>/tmp/live-up
          done
          UP_MBPS=$(awk '{s+=$1*8/1000000;n++} END {printf "%.2f",s/n}' /tmp/live-up)

          run_stream() {
            local name="$1" bytes="$2" rate="$3" target_mbps="$4" planned="$5"
            local start end elapsed actual delivered result
            start=$(date +%s%N)
            curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" --limit-rate "$rate" -o "/tmp/$name.bin" "https://speed.cloudflare.com/__down?bytes=$bytes"
            end=$(date +%s%N)
            actual=$(stat -c %s "/tmp/$name.bin")
            test "$actual" -eq "$bytes"
            elapsed=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.3f",(b-a)/1000000000}')
            delivered=$(awk -v x="$actual" -v s="$elapsed" 'BEGIN {printf "%.2f",x*8/1000000/s}')
            result=$(awk -v e="$elapsed" -v p="$planned" 'BEGIN {if(e<=p*1.30) print "PASS"; else print "FAIL"}')
            rm -f "/tmp/$name.bin"
            printf '%s %s %s\n' "$elapsed" "$delivered" "$result"
          }

          read S1080_SEC S1080_MBPS S1080_RESULT < <(run_stream stream1080 15000000 1000k 8 15)
          read S4K_SEC S4K_MBPS S4K_RESULT < <(run_stream stream4k 46875000 3125k 25 15)

          multi_stream() {
            local name="$1" count="$2" bytes="$3" rate="$4" planned="$5"
            local start end elapsed total size delivered result
            start=$(date +%s%N)
            pids=()
            for i in $(seq 1 "$count"); do
              curl -fsS --connect-timeout 15 --max-time 180 --proxy "$PROXY" --limit-rate "$rate" -o "/tmp/$name-$i.bin" "https://speed.cloudflare.com/__down?bytes=$bytes" &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
            end=$(date +%s%N)
            total=0
            for i in $(seq 1 "$count"); do
              size=$(stat -c %s "/tmp/$name-$i.bin")
              test "$size" -eq "$bytes"
              total=$((total+size))
              rm -f "/tmp/$name-$i.bin"
            done
            elapsed=$(awk -v a="$start" -v b="$end" 'BEGIN {printf "%.3f",(b-a)/1000000000}')
            delivered=$(awk -v x="$total" -v s="$elapsed" 'BEGIN {printf "%.2f",x*8/1000000/s}')
            result=$(awk -v e="$elapsed" -v p="$planned" 'BEGIN {if(e<=p*1.30) print "PASS"; else print "FAIL"}')
            printf '%s %s %s\n' "$elapsed" "$delivered" "$result"
          }

          read M1080_SEC M1080_MBPS M1080_RESULT < <(multi_stream multi1080 4 15000000 1000k 15)
          read M4K_SEC M4K_MBPS M4K_RESULT < <(multi_stream multi4k 2 46875000 3125k 15)

          cat >live-render-results.md <<EOF
          # Live Render benchmark

          Endpoint: sol-eve7.onrender.com
          GitHub Actions region: ${RUNNER_NAME:-hosted-runner}

          | Test | Result |
          |---|---:|
          | First health request | ${FIRST_SEC} s |
          | Warm health latency, 5-run avg | ${WARM_MS} ms |
          | Cloudflare HTTPS latency through tunnel, 10-run avg | ${LAT_MS} ms |
          | Cloudflare 16 MiB download through tunnel, 3-run avg | ${DOWN_MBPS} Mbps |
          | Cloudflare 8 MiB upload through tunnel, 2-run avg | ${UP_MBPS} Mbps |

          ## Streaming-like sustained transfers through real Render deployment

          | Profile | Delivered | Completion | Result |
          |---|---:|---:|---|
          | 1080p target 8 Mbps | ${S1080_MBPS} Mbps | ${S1080_SEC} s | ${S1080_RESULT} |
          | 4K target 25 Mbps | ${S4K_MBPS} Mbps | ${S4K_SEC} s | ${S4K_RESULT} |
          | 4 concurrent 1080p, 32 Mbps aggregate | ${M1080_MBPS} Mbps | ${M1080_SEC} s | ${M1080_RESULT} |
          | 2 concurrent 4K, 50 Mbps aggregate | ${M4K_MBPS} Mbps | ${M4K_SEC} s | ${M4K_RESULT} |

          This run used the public Render TLS/WebSocket endpoint and Render egress to Cloudflare. Streaming checks are paced TCP transfers; they validate sustained tunnel capacity, not DRM/player compatibility or UDP/QUIC.
          EOF

          cat live-render-results.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/4/comments" -F body=@live-render-results.md >/dev/null

          test "$S1080_RESULT" = PASS
          test "$S4K_RESULT" = PASS
          test "$M1080_RESULT" = PASS
          test "$M4K_RESULT" = PASS
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-render-results
          path: live-render-results.md
          if-no-files-found: ignore
