name: android-release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.2.12479018'

      - name: Fetch pinned tun2socks source
        run: sh android/scripts/fetch-hev.sh

      - name: Build SOL Android native core
        run: sh android/scripts/build-solcore.sh "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build ARM64 APK
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sol-vpn-android-arm64-v0.1.0-beta1.apk
          (cd dist && sha256sum sol-vpn-android-arm64-v0.1.0-beta1.apk > SHA256SUMS-android.txt)
          ls -lh dist

      - name: Publish Android beta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-v0.1.0-beta1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite it."
            exit 1
          fi

          cat >/tmp/android-release-notes.md <<'EOF'
          First native Android VPN beta for SOL.

          What it does:
          - Uses Android VpnService, so Termux and v2rayNG are not required.
          - Routes device IPv4 TCP traffic through the persistent SOL /mux WebSocket transport.
          - Handles mapped DNS inside the TUN-to-SOCKS layer so synthetic DNS addresses are restored to hostnames before reaching SOL.
          - Keeps the SOL app itself outside the VPN route to avoid a tunnel loop.

          Requirements:
          - Android 7.0+ (API 24+)
          - ARM64 device
          - A running SOL v0.2-compatible server

          Setup:
          1. Install `sol-vpn-android-arm64-v0.1.0-beta1.apk`.
          2. Enter your server URL such as `wss://YOUR-DOMAIN/ws`.
          3. Enter the server's SOL token.
          4. Tap Connect and approve Android's VPN permission dialog.

          Current limitation: SOL transports TCP only. UDP/QUIC is not tunneled in this beta, so applications need to fall back to TCP/HTTPS.

          This beta is test-signed. Verify the APK with `SHA256SUMS-android.txt`.
          EOF

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title 'SOL VPN Android v0.1.0-beta1' \
            --prerelease \
            --notes-file /tmp/android-release-notes.md
