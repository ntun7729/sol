name: android-release

on:
  push:
    branches:
      - main
    paths:
      - 'android/RELEASE_VERSION'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.2.12479018'

      - name: Fetch pinned tun2socks source
        run: sh android/scripts/fetch-hev.sh

      - name: Build SOL Android native cores
        run: sh android/scripts/build-solcore.sh "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build release, debug, and probe APKs
        run: |
          gradle -p android --no-daemon \
            :app:assembleRelease \
            :app:assembleDebug \
            :probe:assembleDebug

      - name: Package release and smoke-test APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < android/RELEASE_VERSION)
          test -n "$VERSION"
          mkdir -p dist dist-test
          cp android/app/build/outputs/apk/release/app-release.apk "dist/sol-vpn-android-v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-test/sol-vpn-debug.apk
          cp android/probe/build/outputs/apk/debug/probe-debug.apk dist-test/sol-vpn-probe-debug.apk
          (cd dist && sha256sum "sol-vpn-android-v${VERSION}.apk" > SHA256SUMS-android.txt)
          ls -lh dist dist-test

      - uses: actions/upload-artifact@v4
        with:
          name: sol-vpn-android-release
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sol-vpn-android-release-test-apks
          path: dist-test/*
          if-no-files-found: error

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: actions/download-artifact@v4
        with:
          name: sol-vpn-android-release-test-apks
          path: dist-test

      - name: Android 14 end-to-end VPN release gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/scripts/emulator-smoke.sh

  publish:
    needs:
      - build
      - emulator-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sol-vpn-android-release
          path: dist

      - name: Publish verified Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < android/RELEASE_VERSION)
          TAG="android-v${VERSION}"
          APK="sol-vpn-android-v${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite it."
            exit 1
          fi

          cat >/tmp/android-release-notes.md <<EOF
          Native SOL Android VPN ${VERSION}.

          Release gate passed before publication:
          - APK installed and launched on an Android 14 emulator.
          - The actual Connect button and Android VPN permission dialog were exercised.
          - Both the SOL native core and TUN-to-SOCKS native engine stayed running.
          - A separate Android probe app completed an end-to-end HTTP request through the VPN.
          - The probe used mapped DNS and a hostname resolvable only by the SOL server side.
          - Two disconnect/reconnect cycles completed without an app crash.

          Requirements:
          - Android 7.0+ (API 24+)
          - ARM64 or x86_64
          - A running SOL v0.2-compatible server

          Current protocol limitation: SOL transports TCP only. UDP/QUIC is not tunneled.

          This build is test-signed. Verify ${APK} with SHA256SUMS-android.txt.
          EOF

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "SOL VPN Android ${VERSION}" \
            --prerelease \
            --notes-file /tmp/android-release-notes.md
