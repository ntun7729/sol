name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -v ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o sol ./cmd/sol
      - name: Report binary size
        run: ls -lh sol

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sol:test .
      - name: Start server container
        run: docker run -d --rm --name sol-test -e SOL_TOKEN=0123456789abcdef0123456789abcdef -p 18080:10000 sol:test
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs sol-test
          exit 1
      - name: Container size
        run: docker image inspect sol:test --format '{{.Size}} bytes'
