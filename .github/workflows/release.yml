name: release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Test
        run: |
          go mod tidy
          go test ./...

      - name: Build standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            linux/amd64 \
            linux/arm64 \
            windows/amd64 \
            windows/arm64 \
            darwin/amd64 \
            darwin/arm64
          do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            EXT=''
            if [ "$GOOS" = windows ]; then EXT='.exe'; fi
            OUT="dist/sol-${GOOS}-${GOARCH}${EXT}"
            echo "building $OUT"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags='-s -w' -o "$OUT" ./cmd/sol
          done
          (
            cd dist
            sha256sum sol-* > SHA256SUMS.txt
          )
          ls -lh dist

      - name: Publish v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.2.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite it."
            exit 1
          fi

          cat >/tmp/release-notes.md <<'EOF'
          Optimized transport release for high-latency and unreliable mobile links.

          ### Major change

          New clients keep one authenticated WSS connection open and multiplex many SOCKS5 TCP connections inside it. The configured URL may still end in `/ws`; the client automatically uses `/mux` when the updated server supports it and falls back to legacy `/ws` for older deployments.

          This removes the DNS + TCP + TLS + WebSocket handshake from every browser connection. It also adds:

          - mux keepalives and automatic session reconnect
          - 4 MiB per-stream receive window for high-RTT links
          - longer TLS and connection timeouts
          - faster IPv6-to-IPv4 fallback on broken paths
          - TLS session resumption cache for reconnects
          - quiet rejection of unsupported SOCKS5 UDP/BIND probes
          - legacy `/ws` compatibility

          **The server must be redeployed from this release/current main before the client can use `/mux`.**

          Prebuilt binaries are included for Linux, Windows, and macOS on amd64 and arm64. Go is not required.

          Linux/Android proot example:

          ```sh
          chmod +x ./sol-linux-arm64
          SOL_SERVER_URL='wss://your-domain.example/ws' \
          SOL_TOKEN='YOUR_SOL_TOKEN' \
          ./sol-linux-arm64 client
          ```

          A successful optimized connection logs:

          ```text
          optimized multiplexed tunnel connected to wss://your-domain.example/mux
          ```

          The local SOCKS5 proxy remains `127.0.0.1:1080` by default.

          Note: `sol` remains TCP CONNECT only. UDP ASSOCIATE/QUIC is not implemented in v0.2.0.

          Verify downloads with `SHA256SUMS.txt`.
          EOF

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title 'sol v0.2.0' \
            --notes-file /tmp/release-notes.md
