plugins {
    id 'com.android.application'
}

android {
    namespace 'bond.huggy.sol'
    compileSdk 34
    ndkVersion '27.2.12479018'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'bond.huggy.sol'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.1.0-beta2'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_CFLAGS+=-DPKGNAME=bond/huggy/sol -ffile-prefix-map=' + rootDir + '=.'
                arguments 'APP_LDFLAGS+=-Wl,--build-id=none'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
